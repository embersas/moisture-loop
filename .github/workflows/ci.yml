name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test-pure:
    name: Pure-layer tests (no homeassistant installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pure test dependencies
        run: pip install -r requirements_test.txt
      - name: Assert homeassistant is NOT installed (pure boundary)
        run: |
          if pip show homeassistant > /dev/null 2>&1; then
            echo "homeassistant must not be installed in the pure-layer job"
            exit 1
          fi
      - name: Run complete pure test suite
        run: >-
          python -m pytest
          tests/test_models.py
          tests/test_storage_pure.py
          tests/test_state_machine.py
          tests/test_foundation.py
          tests/test_slot_manager.py
          tests/test_traceability.py
          --cov --cov-branch --cov-report=term-missing
      - name: Enforce 100% branch coverage for state_machine.py
        run: |
          if [ -f custom_components/soilsync/state_machine.py ]; then
            coverage report --include="*/state_machine.py" --fail-under=100
          else
            echo "state_machine.py not implemented yet; gate armed but inactive"
          fi

  test-ha-2025-9-0:
    # MANDATORY minimum-platform job (SPECIFICATION.md §39.1 HA2).
    # Pinned to pytest-homeassistant-custom-component==0.13.277, which pins
    # homeassistant==2025.9.0 exactly. This job must never be removed while
    # the 2025.9.0 floor stands.
    name: HA 2025.9.0 harness (mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install HA 2025.9.0 test environment
        run: pip install -r requirements_test_ha.txt
      - name: Verify pinned HA version
        run: python -c "import homeassistant.const as c; assert c.__version__ == '2025.9.0', c.__version__"
      - name: HA1 release-source API contract check
        run: python scripts/check_ha_contract.py --expect 2025.9.0
      - name: Run full test suite with coverage
        run: |
          if [ -d custom_components/soilsync ]; then
            python -m pytest --cov --cov-branch --cov-report=term-missing
          else
            python -m pytest
          fi
      - name: Enforce coverage release gates
        run: |
          if [ -f custom_components/soilsync/state_machine.py ]; then
            coverage report --include="*/state_machine.py" --fail-under=100
          fi
          if [ -d custom_components/soilsync ]; then
            coverage report --fail-under=90
          fi

  test-ha-current:
    # Supported-current HA job, deliberately a separate pinned environment
    # from the mandatory 2025.9.0 job (SPECIFICATION.md §39.1 HA2).
    name: HA 2026.8.3 supported-current harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install supported-current HA test environment
        run: pip install -r requirements_test_ha_current.txt
      - name: Verify pinned HA version
        run: python -c "import homeassistant.const as c; assert c.__version__ == '2026.8.3', c.__version__"
      - name: Supported-current API contract check
        run: python scripts/check_ha_contract.py --expect 2026.8.3
      - name: Run full test suite with branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing

  hassfest:
    # Required GitHub-hosted release gate.
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    # Required GitHub-hosted release gate with no ignored checks.
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
