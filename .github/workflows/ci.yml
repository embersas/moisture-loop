name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test-pure:
    name: Pure-layer tests (no homeassistant installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pure test dependencies
        run: pip install -r requirements_test.txt
      - name: Assert homeassistant is NOT installed (pure boundary)
        run: |
          if pip show homeassistant > /dev/null 2>&1; then
            echo "homeassistant must not be installed in the pure-layer job"
            exit 1
          fi
      - name: Run pure test suite
        # HA-dependent test modules must guard themselves with
        # pytest.importorskip("homeassistant") at module level (DEVELOPMENT.md),
        # so this job runs the full tests/ tree and HA suites skip cleanly.
        run: |
          if [ -d custom_components/moisture_loop ]; then
            pytest --cov --cov-branch --cov-report=term-missing
          else
            pytest
          fi
      - name: Enforce 100% branch coverage for state_machine.py
        run: |
          if [ -f custom_components/moisture_loop/state_machine.py ]; then
            coverage report --include="*/state_machine.py" --fail-under=100
          else
            echo "state_machine.py not implemented yet; gate armed but inactive"
          fi

  test-ha-2025-9-0:
    # MANDATORY minimum-platform job (SPECIFICATION.md §39.1 HA2).
    # Pinned to pytest-homeassistant-custom-component==0.13.277, which pins
    # homeassistant==2025.9.0 exactly. This job must never be removed while
    # the 2025.9.0 floor stands.
    name: HA 2025.9.0 harness (mandatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HA 2025.9.0 test environment
        run: pip install -r requirements_test_ha.txt
      - name: Verify pinned HA version
        run: python -c "import homeassistant.const as c; assert c.__version__ == '2025.9.0', c.__version__"
      - name: HA1 release-source API contract check
        run: python scripts/check_ha_contract.py --expect 2025.9.0
      - name: Run full test suite with coverage
        run: |
          if [ -d custom_components/moisture_loop ]; then
            pytest --cov --cov-branch --cov-report=term-missing
          else
            pytest
          fi
      - name: Enforce coverage release gates
        run: |
          if [ -f custom_components/moisture_loop/state_machine.py ]; then
            coverage report --include="*/state_machine.py" --fail-under=100
          fi
          if [ -d custom_components/moisture_loop ]; then
            coverage report --fail-under=90
          fi

  test-ha-current:
    # Supported-current HA job, deliberately a separate pinned environment
    # from the mandatory 2025.9.0 job (SPECIFICATION.md §39.1 HA2).
    name: HA supported-current harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install supported-current HA test environment
        run: pip install -r requirements_test_ha_current.txt
      - name: Report installed HA version
        run: python -c "import homeassistant.const as c; print('homeassistant', c.__version__)"
      - name: Run full test suite
        run: pytest

  hassfest:
    # Release gate: validates custom_components/moisture_loop/manifest.json.
    # Skips honestly while the integration package does not exist yet
    # (Slice 12 owns final manifest/packaging); it does NOT falsely pass.
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check integration package exists
        id: pkg
        run: |
          if [ -f custom_components/moisture_loop/manifest.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "manifest.json not present yet; hassfest gate armed but inactive"
          fi
      - name: Run hassfest
        if: steps.pkg.outputs.exists == 'true'
        uses: home-assistant/actions/hassfest@master

  hacs:
    # Release gate: HACS validation with category integration.
    # Same honest gating as hassfest until the package exists.
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check integration package exists
        id: pkg
        run: |
          if [ -f custom_components/moisture_loop/manifest.json ] && [ -f hacs.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "manifest.json/hacs.json not present yet; HACS gate armed but inactive"
          fi
      - name: Run HACS validation
        if: steps.pkg.outputs.exists == 'true'
        uses: hacs/action@main
        with:
          category: integration
